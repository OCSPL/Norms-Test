<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User List</title>

    <!-- Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
          rel="stylesheet" />

    <style>
        body{background:#e9ecef;display:flex;flex-direction:column;align-items:center;height:100vh;margin:0}
        .norms-heading{background:#003366;color:#fff;padding:15px 0;text-align:center;font-size:2em;width:100%;position:relative;margin-bottom:20px}
        .button-row{display:flex;justify-content:space-between;position:absolute;top:15px;left:15px;right:15px}
        .container{background:#fff;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.2);padding:20px;width:80%;max-width:800px;margin-top:70px}
        .btn-back{background:#6c757d;color:#fff}
        .btn-edit{background:#007bff;color:#fff}
        .btn-delete{background:#dc3545;color:#fff}
    </style>

    <script>
        function confirmDelete(e){
            if(!confirm("Are you sure you want to delete this user?")) e.preventDefault();
        }
    </script>
</head>
<body>
    <div class="norms-heading">
        NORMS
        <div class="button-row">
            <a href="{{ url_for('admin_panel') }}" class="btn btn-back">Back</a>
        </div>
    </div>

    <div class="container">
        <h2>User List</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <!-- use uid= to match route parameter -->
                        <a href="{{ url_for('edit_user', uid=user.id) }}" class="btn btn-edit">Edit</a>
                        <a href="{{ url_for('delete_user', uid=user.id) }}" class="btn btn-delete"
                           onclick="confirmDelete(event)">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
