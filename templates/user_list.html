<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef; /* Light gray background */
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center; /* Center horizontally */
            height: 100vh; /* Full height */
            margin: 0; /* Remove default margin */
        }
        .norms-heading {
            background-color: #003366; /* Dark blue background for norms */
            color: white; /* White text color */
            padding: 15px 0; /* Padding around the heading */
            text-align: center; /* Center align the text */
            font-size: 2em; /* Increased font size */
            width: 100%; /* Full width */
            position: relative; /* Positioning */
            margin-bottom: 20px; /* Space below the heading */
        }
        .button-row {
            display: flex; /* Use Flexbox for alignment */
            justify-content: space-between; /* Space between buttons */
            position: absolute; /* Position it inside the heading */
            top: 15px; /* Align with heading */
            left: 15px; /* Align to the left */
            right: 15px; /* Align to the right */
        }
        .container {
            background-color: #ffffff; /* White background for the content */
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            padding: 20px; /* Padding around the container */
            width: 80%; /* Width of the container */
            max-width: 800px; /* Maximum width */
            margin-top: 70px; /* Space from the top */
        }
        .btn-back {
            background-color: #6c757d; /* Gray color */
            color: white;
        }
        .btn-edit {
            background-color: #007bff; /* Blue color for Edit */
            color: white;
        }
        .btn-delete {
            background-color: #dc3545; /* Red color for Delete */
            color: white;
        }
    </style>
    <script>
        function confirmDelete(event) {
            const confirmation = confirm("Are you sure you want to delete this user?");
            if (!confirmation) {
                event.preventDefault(); // Prevent the default action
            }
        }
    </script>
</head>
<body>
    <div class="norms-heading">
        NORMS
        <div class="button-row">
            <a href="{{ url_for('admin_panel') }}" class="btn btn-back">Back</a>
        </div>
    </div>
    <div class="container">
        <h2>User List</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <a href="{{ url_for('edit_user', id=user.id) }}" class="btn btn-edit">Edit</a>
                        <a href="{{ url_for('delete_user', id=user.id) }}" class="btn btn-delete" 
                           onclick="confirmDelete(event)">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
