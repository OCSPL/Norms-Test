<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('your-background-image-url.jpg'); /* Update with actual URL */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center; /* Center horizontally */
            height: 100vh;
            margin: 0;
        }
        .norms-heading {
            background-color: #003366; /* Dark blue background for norms */
            color: white; /* White text color */
            padding: 15px 0; /* Padding around the heading */
            text-align: center; /* Center align the text */
            font-size: 2em; /* Increased font size */
            width: 100%; /* Full width */
            margin-bottom: 20px; /* Space below the heading */
            position: relative; /* Positioning */
        }
        .button-row {
            display: flex; /* Use Flexbox for alignment */
            justify-content: space-between; /* Space between buttons */
            position: absolute; /* Position it inside the heading */
            top: 15px; /* Align with heading */
            left: 0; /* Align to the left */
            right: 0; /* Align to the right */
            padding: 0 15px; /* Padding for the buttons */
        }
        .btn-custom {
            padding: 10px 20px; /* Padding for the buttons */
            border-radius: 5px; /* Rounded corners */
        }
        .btn-logout {
            background-color: #dc3545; /* Red for logout */
            color: white;
        }
        .btn-back {
            background-color: #6c757d; /* Gray for back */
            color: white;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            background-color: #f8f9fa; /* Light background for the header */
            padding: 10px;
            border-radius: 5px;
        }
        .btn-add-user {
            background-color: #28a745; /* Green */
            color: white;
            width: 45%; /* Smaller button */
        }
        .btn-user-list {
            background-color: #007bff; /* Blue */
            color: white;
            width: 45%; /* Smaller button */
        }
    </style>
</head>
<body>
    <div class="norms-heading">
        NORMS
        <div class="button-row">
            <a href="{{ url_for('login') }}" class="btn btn-custom btn-back">Back</a>
            <a href="{{ url_for('logout') }}" class="btn btn-custom btn-logout">Logout</a>
        </div>
    </div>
    <div class="container">
        <h2>Welcome to the Admin Panel, {{ session['username'] }}!</h2>
        <a href="{{ url_for('add_user') }}" class="btn btn-custom btn-add-user">Add User</a>
        <a href="{{ url_for('user_list') }}" class="btn btn-custom btn-user-list">User List</a>
    </div>
</body>
</html>
