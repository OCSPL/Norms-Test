<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef; /* Light grey background for the whole page */
            display: flex; /* Flexbox for centering */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            height: 100vh; /* Full viewport height */
            margin: 0; /* Remove default margin */
        }
        .container {
            background-color: #ffffff; /* White background for the content */
            padding: 40px; /* Padding around the container */
            border-radius: 10px; /* Rounded corners */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            text-align: center; /* Center text */
            width: 400px; /* Fixed width for the container */
        }
        h2 {
            margin-bottom: 20px; /* Space below the heading */
            color: #343a40; /* Dark grey color for the text */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Admin to AdminView</h2>
    </div>
</body>
</html>
